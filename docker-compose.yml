services:
  docmirror:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmirror:latest
    container_name: docmirror
    ports:
      - "8000:8000"
    volumes:
      - docmirror_cache:/root/.cache
      - docmirror_data:/root/.docmirror
    environment:
      # Optional: Enable full enhancement mode for parsing
      - DOCMIRROR_ENHANCE_MODE=standard
      - DOCMIRROR_LOG_LEVEL=info
      # Lightweight image: RapidOCR is the only local OCR backend installed.
      - DOCMIRROR_OCR_BACKEND=rapidocr
      # Optional: Control concurrency
      - OMP_NUM_THREADS=4
      # Process-local FIFO: 10 active parses plus up to 50 waiting requests
      - DOCMIRROR_MAX_ACTIVE_PARSES=10
      - DOCMIRROR_MAX_QUEUED_PARSES=50
      - DOCMIRROR_QUEUE_WAIT_TIMEOUT_SECONDS=900
      - DOCMIRROR_WORKERS_PER_PARSE=2
      - DOCMIRROR_PARSE_TIMEOUT_SECONDS=1800
      - DOCMIRROR_PARSE_KILL_GRACE_SECONDS=10
      # Optional: API authentication key
      # - DOCMIRROR_API_KEY=your-secret-key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # For PaddleOCR GPU deployment use docker-compose.gpu.yml instead.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  docmirror_cache:
  docmirror_data:
