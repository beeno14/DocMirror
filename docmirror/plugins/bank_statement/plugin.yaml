schema_version: 1

provider:
  id: bank_statement
  domain_name: bank_statement
  version: community-1
  implementation: docmirror.plugins.bank_statement.community_plugin:plugin

projection:
  dataset_aliases: {statement_header: statement_header, records: transactions}
  dataset_labels: {statement_header: 流水表头, transactions: 交易流水}
  dataset_types: {statement_header: statement_header, transactions: transaction}
  dataset_grains:
    statement_header: one row per source statement/account period
    transactions: one row per transaction
  dataset_foreign_keys:
    transactions:
      - columns: [statement_header_id]
        reference_dataset: statement_header
        reference_columns: [record_id]
  section_type_markers: {交易: transactions}
  completeness:
    records:
      basis: domain_fact_count
      count_key: expected_primary_rows
      public_basis: bank_expected_primary_rows
      count_candidates:
        - key: source_reported_transaction_count
          public_basis: source_footer_transaction_count
          minimum: 1
        - key: expected_primary_rows
          public_basis: bank_expected_primary_rows
          minimum: 1
      verification_status_key: extract_status
      verified_statuses: [success]

classification:
  aliases: [bank_reconciliation]

resources:
  table_styles: resources/table_styles.yaml
  institution_overrides: resources/institution_overrides.yaml
  institutions: resources/institutions.yaml
  field_schema: resources/field_schema.yaml
  confidence_policy: resources/confidence_policy.yaml

projection_outputs:
  document_type: bank_statement
  datasets:
    - statement_header
    - transactions
  domain_fact_prefix: bank_statement
